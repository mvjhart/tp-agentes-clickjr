<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/clickjr/clickjr-favicon.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ClickJr: propuestas de automatización del proceso de postulación a vacantes."
    />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="ClickJr | Automatización de postulaciones"
    />
    <meta
      property="og:image"
      content="https://tp-agentes-clickjr.vercel.app/assets/clickjr/clickjr-og.webp"
    />
    <meta property="og:url" content="https://tp-agentes-clickjr.vercel.app/" />
    <meta property="og:site_name" content="ClickJr" />

    <title>ClickJr</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <script>
      const savedTheme = localStorage.getItem('clickjr-theme')

      const systemPrefersDark = window.matchMedia(
        '(prefers-color-scheme: dark)',
      ).matches

      const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light')

      document.documentElement.setAttribute('data-theme', theme)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
